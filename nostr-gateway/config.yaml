name: Nostr Gateway
slug: nostr_gateway
description: Nostr DM Gateway → n8n
version: "0.1.0"
startup: services
boot: auto
arch:
  - armv7
  - armhf
  - aarch64
  - amd64
  - i386
options:
  relays:
    - wss://relay.damus.io
  n8n_webhook: http://n8n:5678/webhook/nostr-ai
  allowed_pubkeys: []
schema:
  domains:
    - str
  relays:
    type: list(str)
  n8n_webhook:
    type: str
  allowed_pubkeys:
    type: list(str)
environment:
  PYTHONUNBUFFERED: "1"
