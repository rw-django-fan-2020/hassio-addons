name: Nostr Gateway
slug: nostr_gateway
description: Nostr DM Gateway → n8n
version: "0.1.0"
startup: services
boot: auto
arch:
  - amd64
  - aarch64
options:
  relays:
    - wss://relay.damus.io
  n8n_webhook: http://n8n:5678/webhook/nostr-ai
  allowed_pubkeys: []
schema:
  relays:
    type: array
    items:
      type: string
  n8n_webhook:
    type: string
  allowed_pubkeys:
    type: array
    items:
      type: string
environment:
  PYTHONUNBUFFERED: "1"
