name: Aubio Beat Detector
version: "1.0"
slug: aubio_beat
description: Detects beats in audio streams using aubio and exposes them via HTTP
url: https://github.com/rw-django-fan-2020/hassio-addons/tree/main/aubio_beat
startup: services
boot: auto
arch:
  - amd64
  - aarch64
map:
  - share:rw
ports:
  5000/tcp: 5000
options:
  fifo_path: /share/snapfifo/beatfifo
  log_level: info
schema:
  fifo_path: str
  log_level: list(info|debug|warning|error|critical)